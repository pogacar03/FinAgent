services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
      POSTGRES_DB: finagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U finagent]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://finagent:${POSTGRES_PASSWORD:-local_demo_only}@postgres/finagent
      CHECKPOINT_URL: postgresql://finagent:${POSTGRES_PASSWORD:-local_demo_only}@postgres/finagent
      REAL_DATA_PATH: ${REAL_DATA_PATH_CONTAINER:-/data/real/bundle.json}
      BENCHMARK_IMPORT_TOKEN: ${BENCHMARK_IMPORT_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-3}
      LLM_MIN_INTERVAL_SECONDS: ${LLM_MIN_INTERVAL_SECONDS:-0.2}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    volumes:
      - ./data:/data:ro
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, finagent.worker]
    environment:
      <<: *app_env
      WORKER_CONCURRENCY: 3
      WORKER_LEASE_SECONDS: 60
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
