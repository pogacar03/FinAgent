name: FinAgent CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finagent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Offline unit and integration tests
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/python-junit.xml
      - name: Separate-process SQLite E2E
        run: python scripts/e2e_demo.py
      - name: Upload Python test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/python-junit.xml
            artifacts/e2e_report.json
          if-no-files-found: warn
          retention-days: 7

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:provenance
      - run: npm run build

  docker-integration:
    name: Linux Docker and Compose integration
    needs: [python-tests, frontend-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build images, start Compose and verify real containers
        run: bash scripts/ci/docker_check.sh
      - name: Upload container logs and integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/docker-ci/
          if-no-files-found: warn
          retention-days: 7

  ci-verdict:
    name: CI verdict
    needs: [python-tests, frontend-build, docker-integration]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all gates; report actual container verification
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          passed = all(value['result'] == 'success' for value in results.values())
          container_status = 'VERIFIED (Linux CI)' if passed else 'UNVERIFIED'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('# FinAgent CI verdict\n\n')
              for name, value in results.items():
                  report.write(f"- {name}: {value['result']}\n")
              report.write(f'\nContainer functionality: **{container_status}**\n')
              report.write(f"\nCommit: `{os.environ['GITHUB_SHA']}`\n")
          print('Container functionality:', container_status)
          sys.exit(0 if passed else 1)
          PY
